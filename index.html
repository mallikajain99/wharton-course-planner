   ["know","want"].forEach(function(side){ var o={};
    q.rows.forEach(function(r,ri){
     var c=document.querySelector("input[name='"+q.id+"_"+side+"__"+ri+"']:checked"); if(!c) return;
     var ot=r==="__other"?document.querySelector("[data-otherrow='"+q.id+"']").value.trim():"";
     if(r==="__other"&&!ot) return;
     o[r==="__other"?("Other: "+ot):r]=c.value; });
    out.answers[q.id+"_"+side]=o; });
   v=undefined;
  }
  else { v={}; q.rows.concat(["__other"]).forEach(function(r,ri){
    var c=document.querySelector("input[name='"+q.id+"__"+ri+"']:checked"); if(!c) return;
    var ot=r==="__other"?document.querySelector("[data-otherrow='"+q.id+"']").value.trim():"";
    if(r==="__other"&&!ot) return;   // a rating on an unnamed "Other area" row means nothing
    var name=r==="__other"?("Other: "+ot):r;
    v[name]=c.value; }); }
  if(v!==undefined) out.answers[q.id]=v;
  var fb=document.querySelector("[data-fbt='"+q.id+"']").value.trim(); if(fb) out.feedback[q.id]=fb;
 });});
 out.submitted=new Date().toISOString();
 return out;
}
function review(){
 var a=answers(), h="<div class='panel'><div class='steplab'>Review</div><h1>Check your answers</h1><p class='hint'>Click Edit next to any answer to change it, then Submit to see your plan.</p><div class='grow'></div>"+progBar(QS.length)+"</div><div class='body'><div class='rev'>";
 PARTS.forEach(function(p){p.qs.forEach(function(q){
  var v=q.k==="grid2"?null:a.answers[q.id], s;
  if(q.k==="grid2"){ var kn=a.answers[q.id+"_know"]||{}, wa=a.answers[q.id+"_want"]||{};
   s=q.rows.concat(Object.keys(kn).concat(Object.keys(wa)).filter(function(x){return x.indexOf("Other: ")===0;}))
    .filter(function(r,i,arr){return arr.indexOf(r)===i&&(kn[r]||wa[r]);})
    .map(function(r){return r+": know "+(kn[r]||"—")+", want "+(wa[r]||"—");}).join("\n"); }
  if(q.k==="grid2"){}
  else if(Array.isArray(v)) s=v.length?v.join(" · "):"";
  else if(typeof v==="object") s=Object.keys(v).map(function(k){return k+": "+v[k];}).join(" · ");
  else s=v;
  var qi=QS.map(function(x){return x.q.id;}).indexOf(q.id)+1;
  h+="<div class='row'><div class='k'>"+esc(q.t)+"</div><div class='v'>"+(s?esc(s).replace(/\n/g,"<br>"):"<span class='empty'>— skipped</span>")
    +(a.feedback[q.id]?"<span class='fbv'>💬 "+esc(a.feedback[q.id])+"</span>":"")+"</div><button class='edit' data-edit='"+qi+"'>Edit</button></div>";
 });});
 document.getElementById("review").innerHTML=h+"</div></div>";
}
function submit(){
 var a=answers();
 try{
  localStorage.setItem("wcp.answers",JSON.stringify(a.answers));
  localStorage.setItem("wcp.surveyFeedback",JSON.stringify(a.feedback));
  var st=JSON.parse(localStorage.getItem("wcp.state")||"null");
  if(st){ st.rescore=true; localStorage.setItem("wcp.state",JSON.stringify(st)); }
 }catch(e){ alert("Your browser blocked saving (private mode?). The planner needs local storage to work."); return; }
  // anonymous usage count: the event name only — never answers
 try{ if(window.goatcounter&&window.goatcounter.count) window.goatcounter.count({path:"survey-completed",title:"Survey completed",event:true}); }catch(e){}
 setTimeout(function(){ location.href="board.html"; }, 250);
}
function go(n){
 cur=n;
 document.querySelectorAll(".part").forEach(function(x){x.classList.remove("on");});
 if(n<REVIEW) document.querySelector(".part[data-s='"+n+"']").classList.add("on");
 else if(n===REVIEW){ review(); document.getElementById("review").classList.add("on"); }
 else document.getElementById("donep").classList.add("on");
 document.querySelector(".nav").classList.toggle("full",n===0);
 document.getElementById("back").hidden=n===0||n>REVIEW;
 var nx=document.getElementById("next"); nx.hidden=n>REVIEW;
 if(n===REVIEW) editing=false;
 nx.textContent=n===0?"Start →":n===REVIEW?"Submit →":editing?"Back to review ✓":"OK ✓";
 document.getElementById("where").innerHTML=n===0?"":n<REVIEW?"press <b>Enter ↵</b>":"";
 window.scrollTo(0,0);
}
var editing=false;
document.getElementById("next").onclick=function(){ if(cur===REVIEW) submit(); else if(editing){ editing=false; go(REVIEW); } else go(cur+1); };
document.addEventListener("click",function(e){ var b=e.target.closest&&e.target.closest("[data-edit]"); if(!b) return; editing=true; go(+b.dataset.edit); });
document.getElementById("back").onclick=function(){ go(cur-1); };
go(0);
try{ var prev=JSON.parse(localStorage.getItem("wcp.answers")||"null");
 if(prev){ Object.keys(prev).forEach(function(k){ var v=prev[k];
  if(Array.isArray(v)||typeof v==="string"){ (Array.isArray(v)?v:[v]).forEach(function(x){
    var inp=document.querySelector("input[name='"+k+"'][value='"+String(x).replace(/'/g,"\\'")+"']");
    if(inp) inp.checked=true;
    else if(String(x).indexOf("Other: ")===0){ var o=document.querySelector("input[name='"+k+"'][value='__other']"); if(o){o.checked=true;
      var q=document.querySelector(".q[data-q='"+k+"']"); q.querySelector(".other").classList.add("on"); q.querySelector("[data-other]").value=x.slice(7);} }
    var ta=document.querySelector("[data-text='"+k+"']"); if(ta&&typeof v==="string") ta.value=v; }); }
  else if(v&&typeof v==="object"){ var side=k.slice(k.lastIndexOf("_")+1), qid=k.slice(0,k.lastIndexOf("_"));
   var q=PARTS.reduce(function(acc,p){return acc||p.qs.filter(function(z){return z.id===qid;})[0];},null);
   if(q) Object.keys(v).forEach(function(area){ var ri=q.rows.indexOf(area); if(ri<0) return;
     var inp=document.querySelector("input[name='"+qid+"_"+side+"__"+ri+"'][value='"+v[area]+"']"); if(inp) inp.checked=true; }); }
 }); }
}catch(e){}
</script></body></html>
